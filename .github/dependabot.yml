# Written by SWERepo (SWEREPO-SPEC §6.1). Weekly updates for GitHub Actions and Python dependencies, each new
# version proposed once it is a week old: a broken or malicious release is usually caught and pulled by then
# (ADR-20261123-cc8d). Security updates don't wait.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
