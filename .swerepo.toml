standard = 1
swerepo = "0.1.0.dev0"
components = ["docs", "agents", "ci", "security", "github"]
mode = "solo"

[values]
project = "smart-router"
adr_dir = "docs/adr"
progress_dir = "docs/progress"
commands = "- Install: `uv sync`\n- Test: `uv run pytest`\n- Lint: `uv run ruff check --force-exclude <changed .py files>` and `uv run ruff format --check --force-exclude <changed .py files>`\n- Check the standard: `swerepo check`"
test_inline = "`uv run pytest`, `uv run ruff check --force-exclude <changed .py files>` and `uv run ruff format --check --force-exclude <changed .py files>`"
default_branch = "main"
python = ["3.11", "3.12", "3.13", "3.14"]
ci_install = "uv sync"
lint = "gradual"
governance_command = ""
ci_copilot_review = "true"
code_owner = "@login"

[agents]
hosts = ["antigravity", "claude"]

[pr]
enforce = false
warn_since = 2026-11-25

